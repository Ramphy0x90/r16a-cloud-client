<div class="root-container" [class.bg]="!(isAuthenticated$ | async)">
	<div class="pages-render-space">
		@if (isAuthenticated$ | async) {
			<app-header></app-header>
		}
		<router-outlet />
	</div>

	@if (isAuthenticated$ | async) {
		<div class="nav-bar-render-space">
			<nav-bar></nav-bar>
		</div>
	}
</div>

@if (showRedirectOverlay$ | async) {
	<div class="auth-redirect-overlay" aria-busy="true" aria-live="polite">
		<loading-spinner></loading-spinner>
	</div>
}
