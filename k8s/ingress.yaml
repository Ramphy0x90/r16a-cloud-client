apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: r16a-cloud-client
  namespace: r16a-cloud
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # No cert-manager annotation: r16a-cloud-tls is requested and renewed by
    # the backend ingress (r16a-cloud/k8s/ingress.yaml), which covers
    # domovoi.cloud and cloud.r16a.cloud. A second request for the same
    # secret with fewer hosts could overwrite it and drop cloud.r16a.cloud.
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - domovoi.cloud
      secretName: r16a-cloud-tls
  rules:
    - host: domovoi.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: r16a-cloud-client
                port:
                  number: 80
