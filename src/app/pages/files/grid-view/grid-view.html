<div class="file-grid">
	@for (file of files$ | async; track file.id) {
		<div
			class="file-card"
			[class.selected]="selectionMode ? selectedFileIds.has(file.id) : selectedFile?.id === file.id"
			[class.selection-mode]="selectionMode"
			(click)="onFileAction(file)"
		>
			<div class="file-card-checkbox">
				<i
					class="bi"
					[ngClass]="selectedFileIds.has(file.id) ? 'bi-check-circle-fill' : 'bi-circle'"
				></i>
			</div>

			<div class="file-card-media" inViewport (inViewport)="onImageVisible(file)">
				@if (isImageFile(file) && getImagePreviewUrl(file)) {
					<img
						class="file-card-image"
						[src]="getImagePreviewUrl(file)!"
						[alt]="file.name"
					/>
				} @else if (isImageFile(file) && file.blurHash) {
					<div
						class="file-card-blurhash"
						[style.background-image]="'url(' + blurhashToDataUrl(file.blurHash) + ')'"
					></div>
				} @else {
					<i
						class="bi file-card-icon"
						[class.folder-icon]="file.isDirectory"
						[ngClass]="file.isDirectory ? 'bi-folder-fill' : (file.name | iconFromExtension)"
					></i>
				}
			</div>

			<div class="file-card-footer">
				<span class="file-card-name" [title]="file.name">{{ file.name }}</span>
				@if (!showSharedFrom && (file.visibility === 'SHARED' || file.sharedWithIds.length > 0)) {
					<i class="bi bi-people-fill shared-badge" title="Shared"></i>
				}
			</div>
		</div>
	}
</div>
