@if (items.length > 0) {
	<div class="breadcrumbs">
		@if (items.length === 1) {
			<button class="breadcrumb-item" (click)="onRootClick()">
				<i class="bi bi-chevron-left"></i>
				Home
			</button>
		} @else {
			<button class="breadcrumb-item" (click)="onItemClick(items.length - 2)">
				<i class="bi bi-chevron-left"></i>
				{{ items[items.length - 2].name }}
			</button>
		}
	</div>
}
