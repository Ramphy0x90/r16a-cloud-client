<div class="page shared-page">
	<div class="toolbar">
		<h2 class="title">Shared with me</h2>

		<div class="toolbar-actions">
			<file-options
				[viewMode]="viewMode"
				[sortField]="sortField"
				[sortDirection]="sortDirection"
				[selectionMode]="false"
				(viewModeChange)="onViewModeChange($event)"
				(sortFieldChange)="onSortFieldChange($event)"
				(sortDirectionChange)="onSortDirectionChange($event)"
			></file-options>
		</div>
	</div>

	@if (((files$ | async) || []).length !== 0) {
		@if (viewMode === 'grid') {
			<grid-view
				[files$]="files$"
				[selectedFile]="selectedFile"
				[selectionMode]="false"
				[selectedFileIds]="emptySelectedFileIds"
				[imagePreviewUrls]="(imagePreviewUrls$ | async) ?? emptyImagePreviewMap"
				[showSharedFrom]="true"
				(fileClick)="onFileClick($event)"
				(imageVisible)="onImageVisible($event)"
			></grid-view>
		}

		@if (viewMode === 'list') {
			<list-view
				[files$]="files$"
				[selectedFile]="selectedFile"
				[selectionMode]="false"
				[selectedFileIds]="emptySelectedFileIds"
				[imagePreviewUrls]="(imagePreviewUrls$ | async) ?? emptyImagePreviewMap"
				[showSharedFrom]="true"
				(fileClick)="onFileClick($event)"
				(imageVisible)="onImageVisible($event)"
			></list-view>
		}
	} @else {
		<div class="empty-state">
			<i class="bi bi-people"></i>
			<h3>No shared files yet</h3>
			<p>Files other users share with you will appear here</p>
		</div>
	}
</div>

<image-preview-modal
	[state]="imagePreviewState$ | async"
	(close)="closeImagePreview()"
></image-preview-modal>
