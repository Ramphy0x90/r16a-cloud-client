<div class="toolbar" [class.toolbar--selecting]="selectionMode()">
	@if (selectionMode()) {
		<button class="tbar-btn" (click)="onCancelSelection()" aria-label="Cancel selection">
			<i class="bi bi-x-lg"></i>
		</button>

		<span class="selection-count">
			{{ selectedCount() }} <span class="selection-count-label">selected</span>
		</span>

		<div class="tbar-actions">
			@if (selectedCount() > 0) {
				<button class="tbar-btn" (click)="onDownloadSelected()" title="Download">
					<i class="bi bi-download"></i>
				</button>
			}
			@if (!readOnly && selectedCount() === 1) {
				<button class="tbar-btn" (click)="onShareSelected()" title="Share">
					<i class="bi bi-share"></i>
				</button>
				<button class="tbar-btn" (click)="onRenameSelected()" title="Rename">
					<i class="bi bi-pencil"></i>
				</button>
			}
			@if (!readOnly && selectedCount() > 0) {
				<button class="tbar-btn tbar-btn--danger" (click)="onBulkDeleteSelected()" title="Delete">
					<i class="bi bi-trash"></i>
				</button>
			}
		</div>
	} @else {
		<div class="toolbar-nav">
			@if (breadcrumbs().length > 0) {
				<breadcrumb
					[items]="breadcrumbs()"
					(rootClick)="onRootClick()"
					(itemClick)="onBreadcrumbClick($event)"
				></breadcrumb>
			} @else {
				<div class="filter-tabs" role="tablist">
					<button
						role="tab"
						class="filter-tab"
						[class.filter-tab--active]="!sharedFilter"
						[attr.aria-selected]="!sharedFilter"
						(click)="sharedFilterChange.emit(false)"
					>
						<i class="bi bi-cloud"></i>
						<span>My files</span>
					</button>
					<button
						role="tab"
						class="filter-tab"
						[class.filter-tab--active]="sharedFilter"
						[attr.aria-selected]="sharedFilter"
						(click)="sharedFilterChange.emit(true)"
					>
						<i class="bi bi-people"></i>
						<span>Shared</span>
					</button>
				</div>
			}
		</div>

		<div class="tbar-actions">
			<file-options
				[viewMode]="viewMode()"
				[sortField]="sortField()"
				[sortDirection]="sortDirection()"
				[selectionMode]="selectionMode()"
				(viewModeChange)="onViewModeChange($event)"
				(sortFieldChange)="onSortFieldChange($event)"
				(sortDirectionChange)="onSortDirectionChange($event)"
				(selectionModeChange)="onSelectionModeChange($event)"
			></file-options>

			@if (!readOnly) {
				<button class="tbar-btn" (click)="onCreateFolder()" title="New folder">
					<i class="bi bi-folder-plus"></i>
				</button>
				<button class="tbar-btn tbar-btn--primary" (click)="onUpload()" title="Upload">
					<i class="bi bi-cloud-arrow-up"></i>
					<span class="tbar-btn-label">Upload</span>
				</button>
			}
		</div>
	}
</div>
